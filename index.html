<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karma Run 3D - Seva Edition</title>
    <link rel="icon" type="image/png" href="Fevicon.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            background-color: #87ceeb;
            width: 100%;
            height: 100%;
            touch-action: none; /* prevent scroll/zoom on the game canvas only */
        }
        /* Re-enable all touch interaction inside the start form so inputs focus normally */
        #start-form-container, #start-form-container * {
            touch-action: auto;
            user-select: auto;
            -webkit-user-select: auto;
        }

        /* ── Scoreboard ── */
        #scoreboard {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.92);
            padding: 10px 24px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
            border: 2px solid #ccc;
            display: flex;
            gap: 24px;
            align-items: center;
            white-space: nowrap;
        }
        .karma-score { display: flex; align-items: center; }
        .karma-icon { font-size: 24px; margin-right: 8px; }
        .good-karma-icon { color: #4CAF50; }
        .bad-karma-icon  { color: #f44336; }

        /* ── Message box ── */
        #message-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 30px 36px;
            border-radius: 15px;
            text-align: center;
            font-size: 22px;
            z-index: 100;
            display: none;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 420px;
        }
        #message-box button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 28px;
            margin-top: 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.3s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #message-box button:hover { background-color: #0056b3; transform: translateY(-2px); }

        /* ── Game controls (bottom bar) ── */
        #game-controls {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        #game-controls button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            -webkit-tap-highlight-color: transparent;
        }
        #game-controls button:hover { background-color: #218838; transform: translateY(-2px); }
        #game-controls button#restart-button-main { background-color: #dc3545; }
        #game-controls button#restart-button-main:hover { background-color: #c82333; }

        /* ── Start form ── */
        #start-form-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
            flex-direction: column;
            padding: 16px;
        }
        #start-form {
            background: #333;
            padding: 32px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 400px;
        }
        #start-form h2 { margin: 0; font-size: 22px; color: #fff; text-align: center; }
        #start-form label { font-weight: bold; color: #eee; font-size: 16px; }
        #start-form input[type="text"],
        #start-form select {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background-color: #444;
            color: white;
            font-size: 17px;
        }
        #start-form input[type="text"]::placeholder { color: #bbb; }
        #start-form button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        #start-form button:hover { background-color: #0056b3; transform: translateY(-2px); }

        /* ── Player name display ── */
        #player-name-display {
            position: absolute;
            top: 16px; right: 16px;
            background: rgba(255,255,255,0.92);
            padding: 8px 16px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
            border: 2px solid #ccc;
            display: none;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── Loading indicator ── */
        #loading-indicator {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.72);
            color: white;
            padding: 20px 32px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            z-index: 50;
            display: none;
            pointer-events: none;
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive breakpoints ── */
        @media (max-width: 600px) {
            #scoreboard { font-size: 14px; padding: 8px 14px; gap: 14px; top: 10px; }
            .karma-icon  { font-size: 18px; margin-right: 5px; }
            #game-controls { gap: 8px; bottom: 10px; }
            #game-controls button { padding: 8px 12px; font-size: 13px; }
            #player-name-display { font-size: 13px; padding: 6px 10px; top: 10px; right: 10px; max-width: 120px; }
            #message-box { font-size: 18px; padding: 22px 20px; }
        }
        @media (max-width: 380px) {
            #game-controls button { padding: 7px 9px; font-size: 12px; }
            #start-form { padding: 22px; gap: 12px; }
        }
    </style>
</head>
<body>
    <!-- Start Form Container -->
    <div id="start-form-container">
        <form id="start-form">
            <h2>Enter Your Details</h2>
            <div>
                <label for="playerName">Name:</label>
                <input type="text" id="playerName" placeholder="Your Name" required>
            </div>
            <div>
                <label for="playerGender">Gender:</label>
                <select id="playerGender" required>
                    <option value="male" selected>Male</option> <!-- Default selected -->
                    <option value="female">Female</option>
                </select>
            </div>
            <button type="submit" id="start-game-button">Start Game</button>
        </form>
    </div>

    <!-- Scoreboard with enhanced styling and icons -->
    <div id="scoreboard" style="display: none;">
        <div class="karma-score">
            <span class="karma-icon good-karma-icon">😊</span>
            Good Karma: <span id="good-karma-value">0</span>
        </div>
        <div class="karma-score">
            <span class="karma-icon bad-karma-icon">😞</span>
            Bad Karma: <span id="bad-karma-value">0</span>
        </div>
    </div>

    <!-- Player Name Display -->
    <!-- <div id="player-name-display" style="display: none;">
        Welcome, <span id="current-player-name"></span>
    </div> -->

    <!-- Message box for game over/instructions -->
    <div id="message-box">
        <p id="message-text"></p>
        <button id="restart-button">Restart Game</button>
    </div>

    <!-- Game Controls -->
    <div id="game-controls" style="display: none;">
        <button id="pause-button">Pause</button>
        <button id="restart-button-main">Restart Game</button>
        <button id="change-player-button">Change Player</button>
    </div>

    <!-- Loading indicator shown while FBX character model downloads -->
    <div id="loading-indicator">
        <div class="loading-spinner"></div>
        <p style="margin:0;">Loading character…</p>
    </div>

    <!-- Import Map for Three.js modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.155.0/examples/jsm/"
            }
        }
    </script>

    <!-- Three.js library and FBXLoader -->
    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // Global variables for Three.js scene, camera, and renderer
        let scene, camera, renderer;
        // Game state variables
        let scoreboard, goodKarmaValue, badKarmaValue;
        let karma = { good: 0, bad: 0 };
        let player; // This will now hold the loaded FBX model
        let mixer; // Animation mixer for the FBX model
        let clock; // Clock for animation updates

        // Adjusted laneWidth to make lanes narrower and movement feel less "extreme"
        const laneWidth = 7; // New width of each main lane
        // Width of the road shoulders added to the sides
        const roadShoulderWidth = 5;
        // Updated lanePositions based on the new laneWidth
        let lanePositions = [-laneWidth, 0, laneWidth]; // X positions for the three playable lanes
        let currentLane = 1; // Player starts in the middle lane (index 1)
        let obstacles = []; // Array to store active obstacles
        let tokens = []; // Array to store active tokens
        let gameSpeed = 0.2; // Initial speed of objects moving towards the player (now positive for world movement)
        const initialGameSpeed = 0.2; // Initial game speed for scaling difficulty
        const maxGameSpeed = 4.0; // Maximum game speed
        const speedIncreaseRate = 0.03; // How much speed increases per interval
        const speedIncreaseIntervalTime = 3000; // Increase speed every 5 seconds
        let animationFrameId; // To store the ID of the requestAnimationFrame
        let isGameOver = false; // Flag to control game state
        let isPaused = false; // Flag to control pause state

        // Road movement variables
        let roadSegments = []; // Array to store individual road segments for continuous movement
        const roadSegmentLength = 40; // Length of each road segment
        const roadSegmentCount = 10; // Number of road segments to create a continuous loop

        // Tree model variables
        let loadedTreeModel = null; // To store the loaded GLB tree model
        const treeSpacing = 10; // Approximate visual width of the tree for spacing, adjust as needed for your model

        // Player movement smoothing variables
        let targetPlayerX = 0; // The target X position the player is moving towards
        const playerMoveSpeed = 0.1; // Controls the smoothness of lane changes (0.1 is a good starting point)
        let speedIntervalId; // Interval ID for speed increase

        // Difficulty increase variables for obstacles/tokens (distance-based)
        let lastObstacleZ = 0; // Z position of the last spawned obstacle
        let currentObstacleSpawnDistance = 15; // Initial distance between obstacles (Adjusted to be closer)
        const initialObstacleSpawnDistance = 15; // (Adjusted to be closer)
        const minObstacleSpawnDistance = 5; // Minimum distance between obstacles (Adjusted to be closer)
        const obstacleDistanceDecreaseRate = 1; // Decrease distance by this amount (Adjusted for smoother curve)

        let lastTokenZ = 0; // Z position of the last spawned token
        let currentTokenSpawnDistance = 12; // Initial distance between tokens (Adjusted to be closer)
        const initialTokenSpawnDistance = 12; // (Adjusted to be closer)
        const minTokenSpawnDistance = 4; // Minimum distance between tokens (Adjusted to be closer)
        const tokenDistanceDecreaseRate = 1; // Decrease distance by this amount (Adjusted for smoother curve)

        const distanceDecreaseIntervalTime = 5000; // Decrease spawn distances every 5 seconds (Adjusted for faster difficulty)
        let difficultyIntervalId; // Interval ID for difficulty increase

        let pauseButton; // Reference to the pause button
        let changePlayerButton; // Reference to the change player button

        // Distance-based spawning: rows spawn once the world has scrolled far
        // enough, so spacing stays consistent regardless of frame rate.
        let distanceSinceLastSpawn = 0;

        // References to form elements
        let startFormContainer;
        let startForm;
        let playerNameInput;
        let playerGenderSelect;
        let playerNameDisplay; // Reference to player name display div
        let currentPlayersName; // Reference to span for current player name

        // Global font variable for 3D text
        let font = null;

        // Karma lists
       const goodKarmas = [
            { english: "Truthfulness", hindi: "सच" },
            { english: "Gratitude", hindi: "धन्यवाद" },
            { english: "Respect", hindi: "आदर" },
            { english: "Integrity", hindi: "सच्चाई" },
            { english: "Guidance", hindi: "सुझाव" },
            { english: "Compassion", hindi: "दया" },
            { english: "Forgiveness", hindi: "माफ़ी" },
            { english: "Self-control", hindi: "नियंत्रण" },
            { english: "Spirituality", hindi: "भक्ति" },
            { english: "Charity", hindi: "दान" },
            { english: "Discipline", hindi: "नियम" },
            { english: "Support", hindi: "सहारा" },
            { english: "Simplicity", hindi: "सादा" },
            { english: "Ahimsa", hindi: "न हिंसा" }
        ];


        const badKarmas = [
            { english: "Violence", hindi: "मारपीट" },
            { english: "Deceit", hindi: "झूठ" },
            { english: "Theft", hindi: "चोरी" },
            { english: "Disrespect", hindi: "बेइज़्ज़ती" },
            { english: "Slander", hindi: "बुराई" },
            { english: "Greed", hindi: "लालच" },
            { english: "Exploitation", hindi: "फायदा उठाना" },
            { english: "Cruelty", hindi: "जुल्म" },
            { english: "Addiction", hindi: "लत" },
            { english: "Malice", hindi: "नफरत" },
            { english: "Wastefulness", hindi: "फिजूलखर्ची" },
            { english: "Ego", hindi: "घमंड" },
            { english: "Treachery", hindi: "धोखा" },
            { english: "Instigation", hindi: "उकसाना" },
            { english: "Sloth", hindi: "सुस्ती" }
        ];



        // Initialize the Three.js scene, camera, and renderer
        async function init() {
            // Scene setup
            scene = new THREE.Scene();
            // Set a background color for the scene (light blue for sky)
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 200); // Add fog for depth perception

            // Camera setup (PerspectiveCamera for 3D view)
            camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
            updateCameraFraming();

            // Initialize clock for animation updates
            clock = new THREE.Clock();

            // Renderer setup (WebGLRenderer for rendering 3D graphics)
            // Touch (mobile/tablet) devices get lighter settings — shadows and
            // antialiasing are among the most expensive GPU features and are
            // the main cause of jitter/stutter on phones.
            const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
            renderer = new THREE.WebGLRenderer({ antialias: !isTouchDevice });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouchDevice ? 1.5 : 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = !isTouchDevice;
            document.body.appendChild(renderer.domElement);

            // Get scoreboard elements
            scoreboard = document.getElementById("scoreboard");
            goodKarmaValue = document.getElementById("good-karma-value");
            badKarmaValue = document.getElementById("bad-karma-value");

            // Get references to control buttons
            pauseButton = document.getElementById('pause-button');
            const mainRestartButton = document.getElementById('restart-button-main');
            changePlayerButton = document.getElementById('change-player-button');

            // Get references to form elements
            startFormContainer = document.getElementById('start-form-container');
            startForm = document.getElementById('start-form');
            playerNameInput = document.getElementById('playerName');
            playerGenderSelect = document.getElementById('playerGender');
            playerNameDisplay = document.getElementById('player-name-display');
            currentPlayersName = document.getElementById('current-player-name');


            // Add event listener for window resizing to make the game responsive
            window.addEventListener('resize', onWindowResize, false);

            // Add event listener for form submission (before loadAssets so it works immediately)
            startForm.addEventListener('submit', (e) => {
                e.preventDefault(); // Prevent default form submission
                startGame();
            });

            // Load tree model and font in the background while form is displayed
            await loadAssets();

            // Add event listeners for game control buttons
            pauseButton.addEventListener('click', togglePause);
            mainRestartButton.addEventListener('click', resetGame);
            document.getElementById('restart-button').addEventListener('click', resetGame);
            changePlayerButton.addEventListener('click', showPlayerSelectionFormAndResetGame);
        }

        // Function to load the player model based on gender
        async function loadPlayerModel(modelPath) {
            const fbxLoader = new FBXLoader();
            return new Promise((resolve, reject) => {
                fbxLoader.load(modelPath, (fbx) => {
                    // Remove existing player if any (e.g., from a previous game session or placeholder)
                    if (player) {
                        scene.remove(player);
                        player.traverse(object => {
                            if (object.geometry) object.geometry.dispose();
                            if (object.material) object.material.dispose();
                        });
                    }

                    player = fbx;
                    // Adjust scale based on the model path
                    if (modelPath === './Fast_Run_Girl.fbx') {
                        player.scale.set(0.015, 0.015, 0.015); // Made girl model bigger
                    } else {
                        player.scale.set(0.01, 0.01, 0.01); // Default size for the boy model (as it is)
                    }
                    player.position.set(lanePositions[currentLane], 0.2, 5);
                    targetPlayerX = lanePositions[currentLane]; // Sync with current lane when model swaps in
                    player.rotation.y = Math.PI;
                    player.traverse(function (object) {
                        if (object.isMesh) object.castShadow = true;
                    });
                    mixer = new THREE.AnimationMixer(player);
                    if (fbx.animations && fbx.animations.length > 0) {
                        const action = mixer.clipAction(fbx.animations[0]);
                        action.play();
                    } else {
                        console.warn('No animations found in the loaded FBX player model.');
                    }
                    scene.add(player);
                    document.getElementById('loading-indicator').style.display = 'none';
                    resolve();
                }, undefined, (error) => {
                    console.error('An error occurred loading the FBX player model:', error);
                    document.getElementById('loading-indicator').style.display = 'none';
                    createBasicPlayerPlaceholder(); // Fallback only when FBX truly fails
                    resolve();
                });
            });
        }


        // Function to start the game after form submission
        function startGame() {
            startFormContainer.style.display = 'none';
            scoreboard.style.display = 'flex';
            document.getElementById('game-controls').style.display = 'flex';
            playerNameDisplay.style.display = 'block';

            const name = playerNameInput.value;
            const gender = playerGenderSelect.value;
            currentPlayersName.innerText = name;

            // Set up the scene but do NOT start the animation loop yet
            setupLighting();
            resetGame(false); // false = don't start animation loop

            // Render one still frame so the road is visible while the character loads
            renderer.render(scene, camera);

            // Show loading indicator while the FBX character model downloads (~27–51 MB)
            document.getElementById('loading-indicator').style.display = 'block';

            const playerModelPath = (gender === 'female') ? './Fast_Run_Girl.fbx' : './Fast_Run_Boy.fbx';

            // Start animation ONLY after the model is fully loaded (or failed to load)
            loadPlayerModel(playerModelPath).then(() => {
                renderer.setAnimationLoop(animate);
            });
        }

        // Function to show the player selection form and reset the game
        function showPlayerSelectionFormAndResetGame() {
            scoreboard.style.display = 'none';
            document.getElementById('game-controls').style.display = 'none';
            playerNameDisplay.style.display = 'none';
            document.getElementById('loading-indicator').style.display = 'none';

            startFormContainer.style.display = 'flex';

            // Stop the current game animation and clear intervals
            renderer.setAnimationLoop(null);
            clearInterval(speedIntervalId);
            clearInterval(difficultyIntervalId);

            // Reset game state without immediately starting the animation loop
            // The animation loop will restart when the form is submitted again via startGame()
            resetGame(false); // Pass false to indicate not to restart animation loop immediately
        }


        // Function to handle window resizing
        function onWindowResize() {
            updateCameraFraming();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // The camera's `fov` (90) is a VERTICAL field of view in three.js, so on
        // narrow/portrait phone and tablet screens the horizontal FOV shrinks a
        // lot (e.g. ~48° on a typical portrait phone vs the full 90° vertically),
        // which was pushing the left/right lanes out of view and hiding the
        // character when changing lanes. Pull the camera further back on
        // narrower screens so both side lanes always stay on-screen.
        const cameraLookAtZ = 5; // matches the player's fixed Z position
        const cameraHeight = 6.5; // raised slightly for a bit more top-down view
        const minCameraDistance = 7; // original distance, used on wide (desktop/landscape) screens
        const maxCameraDistance = 30;
        function updateCameraFraming() {
            const aspect = window.innerWidth / window.innerHeight;
            camera.aspect = aspect;

            const halfViewWidthNeeded = laneWidth + 2.5; // outer lane center + margin for character width
            const vFovHalfTan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
            let distance = halfViewWidthNeeded / (aspect * vFovHalfTan);
            distance = THREE.MathUtils.clamp(distance, minCameraDistance, maxCameraDistance);

            camera.position.set(0, cameraHeight, cameraLookAtZ + distance);
            camera.lookAt(0, 1.5, cameraLookAtZ);
            camera.updateProjectionMatrix();
        }

        // Function to load all 3D assets (tree model and font)
        async function loadAssets() {
            const gltfLoader = new GLTFLoader();
            const fontLoader = new FontLoader();

            const treeLoadPromise = new Promise((resolve) => {
                gltfLoader.load('./tree.glb', (gltf) => {
                    loadedTreeModel = gltf.scene;
                    loadedTreeModel.scale.set(1, 1, 1);
                    loadedTreeModel.traverse(function (object) {
                        if (object.isMesh) {
                            object.castShadow = true;
                            object.receiveShadow = true;
                        }
                    });
                    resolve();
                }, undefined, (error) => {
                    console.error('An error occurred loading the GLB tree model:', error);
                    resolve(); // Resolve even on error
                });
            });

            // Load the font
            const fontLoadPromise = new Promise((resolve, reject) => {
                // IMPORTANT: The file at this path MUST be a valid Three.js typeface.json file,
                // generated by a dedicated Three.js font converter (e.g., https://gero3.github.io/facetype.js/).
                // A generic JSON file or a font file simply renamed to .json will not work.
                fontLoader.load('/fonts/Poppins_Medium_Regular.json', (loadedFont) => {
                    font = loadedFont;
                    console.log('Font loaded successfully.');
                    resolve();
                }, undefined, (error) => {
                    console.error('An error occurred loading the font:', error);
                    // Crucially, if the font fails to load or is invalid, 'font' remains null.
                    // The game will then use fallback shapes instead of crashing.
                    resolve();
                });
            });

            // Wait for both tree model and font to load
            await Promise.all([treeLoadPromise, fontLoadPromise]);
        }

        // Function to create a tree instance (clones the loaded GLB model)
        function createTree() {
            if (!loadedTreeModel) {
                console.warn('Tree model not loaded. Cannot create tree instance.');
                return null;
            }
            const treeClone = loadedTreeModel.clone();
            // Apply random slight scaling for variety to the clone
            const scale = 0.8 + Math.random() * 0.4; // Scale between 0.8 and 1.2
            treeClone.scale.set(scale, scale, scale);
            // Position the tree correctly on the ground (adjust based on your tree model's pivot)
            // Assuming the tree model's base is at Y=0 in its original file
            treeClone.position.y = 0; // Adjust if your tree model's origin is not at its base
            return treeClone;
        }

        // Fallback function to create a simple player if FBX model fails to load
        function createBasicPlayerPlaceholder() {
            // Remove existing player if it was added (e.g., previous failed load)
            if (player) {
                scene.remove(player);
                player.traverse(object => {
                    if (object.geometry) object.geometry.dispose();
                    if (object.material) object.material.dispose();
                });
            }

            player = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.4), new THREE.MeshBasicMaterial({ color: 0x0077ff }));
            torso.position.y = 1.8;
            player.add(torso);
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffcc99 }));
            head.position.y = 2.7;
            player.add(head);
            const legGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
            const legMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // White legs
            player.legLeft = new THREE.Mesh(legGeo, legMat);
            player.legLeft.position.set(-0.2, 0.4, 0);
            player.add(player.legLeft);
            player.legRight = new THREE.Mesh(legGeo, legMat);
            player.legRight.position.set(0.2, 0.4, 0);
            player.add(player.legRight);
            const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
            const armMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
            player.armLeft = new THREE.Mesh(armGeo, armMat);
            player.armLeft.position.set(-0.6, 2.0, 0);
            player.add(player.armLeft);
            player.armRight = new THREE.Mesh(armGeo, armMat);
            player.armRight.position.set(0.6, 2.0, 0);
            player.add(player.armRight);
            player.position.set(lanePositions[currentLane], 0.2, 5);
            scene.add(player);
        }


        // Create the road with multiple lanes and dashed lines, including shoulders
        function setupRoad() {
            const roadMaterial = new THREE.MeshPhongMaterial({ color: 0x333333, shininess: 10 });
            const shoulderMaterial = new THREE.MeshPhongMaterial({ color: 0x444444, shininess: 5 });
            const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });

            // Clear any existing road segments before recreating (for reset)
            roadSegments.forEach(segment => scene.remove(segment));
            roadSegments = [];

            const totalRoadLength = roadSegmentLength * roadSegmentCount;
            // Position segments to cover the visible range, starting from far back (negative Z)
            // and extending forward (positive Z).
            const initialZStart = - (totalRoadLength / 2) - roadSegmentLength; // Start well behind the camera's view

            for (let i = 0; i < roadSegmentCount; i++) {
                const segmentGroup = new THREE.Group();
                // Calculate segment Z position: initial start plus (index * segment length)
                const segmentZ = initialZStart + (i * roadSegmentLength);

                // Create three main road lanes for this segment
                for (let j = 0; j < 3; j++) {
                    const roadGeo = new THREE.PlaneGeometry(laneWidth, roadSegmentLength);
                    const lane = new THREE.Mesh(roadGeo, roadMaterial);
                    lane.rotation.x = -Math.PI / 2; // Rotate to lie flat on the XZ plane
                    lane.position.x = -laneWidth + j * laneWidth;
                    lane.receiveShadow = true; // Road can receive shadows
                    segmentGroup.add(lane);
                }

                // Create road shoulders for this segment
                const leftShoulderX = -laneWidth - (laneWidth / 2) - (roadShoulderWidth / 2);
                const shoulderLeftGeo = new THREE.PlaneGeometry(roadShoulderWidth, roadSegmentLength);
                const shoulderLeft = new THREE.Mesh(shoulderLeftGeo, shoulderMaterial);
                shoulderLeft.rotation.x = -Math.PI / 2;
                shoulderLeft.position.x = leftShoulderX;
                shoulderLeft.receiveShadow = true;
                segmentGroup.add(shoulderLeft);

                const rightShoulderX = laneWidth + (laneWidth / 2) + (roadShoulderWidth / 2);
                const shoulderRightGeo = new THREE.PlaneGeometry(roadShoulderWidth, roadSegmentLength);
                const shoulderRight = new THREE.Mesh(shoulderRightGeo, shoulderMaterial);
                shoulderRight.rotation.x = -Math.PI / 2;
                shoulderRight.position.x = rightShoulderX;
                shoulderRight.receiveShadow = true;
                segmentGroup.add(shoulderRight);

                // Add dashed white strips between main lanes for this segment
                const lineCountPerSegment = roadSegmentLength / 10; // Adjust as needed for density
                const stripLength = 4;
                const stripWidth = 0.3;
                const stripSpacing = roadSegmentLength / lineCountPerSegment;

                for (let j = 1; j < 3; j++) { // For the two lines between three lanes
                    for (let k = 0; k < lineCountPerSegment; k++) {
                        const lineGeo = new THREE.PlaneGeometry(stripWidth, stripLength);
                        const line = new THREE.Mesh(lineGeo, lineMaterial);
                        line.rotation.x = -Math.PI / 2;
                        line.position.x = -laneWidth / 2 + (j - 1) * laneWidth;
                        line.position.y = 0.01; // Slightly above the road to prevent Z-fighting
                        segmentGroup.add(line);
                    }
                }
                segmentGroup.position.z = segmentZ; // Set the overall Z position of the segment group
                scene.add(segmentGroup);
                roadSegments.push(segmentGroup); // Store the entire segment group

                // Add trees to this segment
                const treesPerSegmentSide = Math.ceil(roadSegmentLength / treeSpacing); // Calculate based on treeSpacing
                // treeOffsetFromShoulder: This value controls how far the trees are from the road.
                // Smaller value = closer to road. Larger value = further from road.
                const treeOffsetFromShoulder = -1;

                if (loadedTreeModel) { // Only add trees if the model was loaded successfully
                    for (let t = 0; t < treesPerSegmentSide; t++) {
                        // Calculate Z position to ensure continuous placement
                        const treeZ = - (roadSegmentLength / 2) + (t * treeSpacing);

                        // Left side trees
                        const treeLeft = createTree();
                        if (treeLeft) {
                            treeLeft.position.x = leftShoulderX - (roadShoulderWidth / 2) - treeOffsetFromShoulder;
                            treeLeft.position.z = treeZ;
                            segmentGroup.add(treeLeft);
                        }

                        // Right side trees
                        const treeRight = createTree();
                        if (treeRight) {
                            treeRight.position.x = rightShoulderX + (roadShoulderWidth / 2) + treeOffsetFromShoulder;
                            treeRight.position.z = treeZ;
                            segmentGroup.add(treeRight);
                        }
                    }
                }
            }
        }

        // Add ambient and directional lighting to the scene
        function setupLighting() {
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8d8d8d, 1); // Softer ambient light
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2); // Brighter directional light
            dirLight.position.set(-3, 10, -10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 5;
            dirLight.shadow.camera.bottom = -5;
            dirLight.shadow.camera.left = -5;
            dirLight.shadow.camera.right = 5;
            dirLight.shadow.camera.near = 0.1;
            dirLight.shadow.camera.far = 50;
            dirLight.shadow.mapSize.width = 1024; // Increase shadow map resolution
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            // Optional: Helper to visualize the directional light's shadow camera
            // scene.add(new THREE.CameraHelper(dirLight.shadow.camera));
        }



        // Disposes geometry/material of an Object3D and its children so removed
        // obstacles/tokens don't leak GPU memory (text geometries are created
        // fresh on every spawn and were previously never freed).
        function disposeObject3D(obj) {
            obj.traverse(child => {
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
            });
        }

        // Function to create a token (now 3D text for good karma)
        function createToken(z, laneIndex) {
            let tokenGroup = new THREE.Group(); // Group to hold both English and Hindi text
            const goodKarma = goodKarmas[Math.floor(Math.random() * goodKarmas.length)];
            // Unified color for all karma words
            const material = new THREE.MeshBasicMaterial({ color: 0xFFFFFF }); // Simple, bright, no lighting

            if (!font) {
                console.warn("Font not loaded for token text or is invalid. Using fallback sphere.");
                const geo = new THREE.SphereGeometry(0.6, 24, 24);
                const token = new THREE.Mesh(geo, material);
                tokenGroup.add(token); // Add fallback to group
            } else {
                try {
                    // English text
                    const englishTextGeo = new TextGeometry(goodKarma.english, {
                        font: font,
                        size: 0.8, // Adjusted text size
                        height: 0.2, // Adjusted text depth
                        curveSegments: 6
                    });
                    englishTextGeo.computeBoundingBox();
                    englishTextGeo.center();
                    const englishTextMesh = new THREE.Mesh(englishTextGeo, material);
                    tokenGroup.add(englishTextMesh);

                    // Hindi text, positioned below English text
                    const hindiTextGeo = new TextGeometry(goodKarma.hindi, {
                        font: font,
                        size: 0.5, // Smaller size for Hindi
                        height: 0.15,
                        curveSegments: 6
                    });
                    hindiTextGeo.computeBoundingBox();
                    hindiTextGeo.center();
                    const hindiTextMesh = new THREE.Mesh(hindiTextGeo, material);

                    // Calculate vertical offset for Hindi text
                    const englishTextHeight = englishTextGeo.boundingBox.max.y - englishTextGeo.boundingBox.min.y;
                    const hindiTextHeight = hindiTextGeo.boundingBox.max.y - hindiTextGeo.boundingBox.min.y;
                    // Position Hindi text below English text with a small gap
                    hindiTextMesh.position.y = englishTextMesh.position.y - (englishTextHeight / 2) - (hindiTextHeight / 2) - 0.15;

                    tokenGroup.add(hindiTextMesh);
                } catch (e) {
                    console.error("Error creating 3D text for token (font issue):", e);
                    console.warn("Falling back to basic sphere for token due to font error.");
                    const geo = new THREE.SphereGeometry(0.6, 24, 24);
                    const token = new THREE.Mesh(geo, material);
                    tokenGroup.add(token); // Add fallback to group
                }
            }

            // Position the entire group in the specified lane
            tokenGroup.position.set(lanePositions[laneIndex], 2.0, z);
            tokenGroup.castShadow = true;
            scene.add(tokenGroup);
            tokens.push(tokenGroup);
        }

        // Function to create an obstacle (now 3D text for bad karma)
        function createObstacle(z, laneIndex) {
            let obstacleGroup = new THREE.Group(); // Group to hold both English and Hindi text
            const badKarma = badKarmas[Math.floor(Math.random() * badKarmas.length)];
            // Unified color for all karma words
            const material = new THREE.MeshBasicMaterial({ color: 0xFFFFFF }); // Simple, bright, no lighting

            if (!font) {
                console.warn("Font not loaded for obstacle text or is invalid. Using fallback box.");
                const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                const ob = new THREE.Mesh(geo, material);
                obstacleGroup.add(ob); // Add fallback to group
            } else {
                try {
                    // English text
                    const englishTextGeo = new TextGeometry(badKarma.english, {
                        font: font,
                        size: 1.0, // Adjusted text size
                        height: 0.3, // Adjusted text depth
                        curveSegments: 6
                    });
                    englishTextGeo.computeBoundingBox();
                    englishTextGeo.center();
                    const englishTextMesh = new THREE.Mesh(englishTextGeo, material);
                    obstacleGroup.add(englishTextMesh);

                    // Hindi text, positioned below English text
                    const hindiTextGeo = new TextGeometry(badKarma.hindi, {
                        font: font,
                        size: 0.7, // Smaller size for Hindi
                        height: 0.2,
                        curveSegments: 6
                    });
                    hindiTextGeo.computeBoundingBox();
                    hindiTextGeo.center();
                    const hindiTextMesh = new THREE.Mesh(hindiTextGeo, material);

                    // Calculate vertical offset for Hindi text
                    const englishTextHeight = englishTextGeo.boundingBox.max.y - englishTextGeo.boundingBox.min.y;
                    const hindiTextHeight = hindiTextGeo.boundingBox.max.y - hindiTextGeo.boundingBox.min.y;
                    // Position Hindi text below English text with a small gap
                    hindiTextMesh.position.y = englishTextMesh.position.y - (englishTextHeight / 2) - (hindiTextHeight / 2) - 0.2;

                    obstacleGroup.add(hindiTextMesh);
                } catch (e) {
                    console.error("Error creating 3D text for obstacle (font issue):", e);
                    console.warn("Falling back to basic box for obstacle due to font error.");
                    const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
                    const ob = new THREE.Mesh(geo, material);
                    obstacleGroup.add(ob); // Add fallback to group
                }
            }

            // Position the entire group in the specified lane
            obstacleGroup.position.set(lanePositions[laneIndex], 2.5, z);
            obstacleGroup.castShadow = true;
            scene.add(obstacleGroup);
            obstacles.push(obstacleGroup);
        }

        // New function to create a set of three karma objects (all lanes filled)
        function createKarmaSet(z) {
            // Create a random distribution of good and bad karma across all three lanes
            const karmaDistribution = [];
            
            // Randomly decide how many good vs bad karma (1-2 good, 1-2 bad)
            const goodCount = Math.floor(Math.random() * 2) + 1; // 1 or 2 good karma
            const badCount = 3 - goodCount; // Remaining are bad karma
            
            // Fill the distribution array
            for (let i = 0; i < goodCount; i++) {
                karmaDistribution.push('good');
            }
            for (let i = 0; i < badCount; i++) {
                karmaDistribution.push('bad');
            }
            
            // Shuffle the distribution randomly
            for (let i = karmaDistribution.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [karmaDistribution[i], karmaDistribution[j]] = [karmaDistribution[j], karmaDistribution[i]];
            }
            
            // Create karma objects in each lane
            for (let laneIndex = 0; laneIndex < 3; laneIndex++) {
                if (karmaDistribution[laneIndex] === 'good') {
                    createToken(z, laneIndex);
                } else {
                    createObstacle(z, laneIndex);
                }
            }
        }

        // Function to increase game speed over time
        function increaseGameSpeed() {
            if (gameSpeed < maxGameSpeed) {
                gameSpeed = Math.min(gameSpeed + speedIncreaseRate, maxGameSpeed);
                console.log('Game Speed Increased:', gameSpeed.toFixed(2));
            }
        }

        // Function to decrease spawn distances (increase difficulty)
        function decreaseSpawnDistances() {
            // Decrease obstacle spawn distance
            if (currentObstacleSpawnDistance > minObstacleSpawnDistance) {
                currentObstacleSpawnDistance = Math.max(currentObstacleSpawnDistance - obstacleDistanceDecreaseRate, minObstacleSpawnDistance);
                console.log('Obstacle Spawn Distance:', currentObstacleSpawnDistance);
            }

            // Decrease token spawn distance
            if (currentTokenSpawnDistance > minTokenSpawnDistance) {
                currentTokenSpawnDistance = Math.max(currentTokenSpawnDistance - tokenDistanceDecreaseRate, minTokenSpawnDistance);
                console.log('Token Spawn Distance:', currentTokenSpawnDistance);
            }
        }

        // Function to toggle game pause state
        function togglePause() {
            isPaused = !isPaused; // Toggle the pause flag
            if (isPaused) {
                // Game is paused: Stop animation and clear intervals
                pauseButton.innerText = 'Resume';
                renderer.setAnimationLoop(null); // Stop requestAnimationFrame
                clearInterval(speedIntervalId);
                clearInterval(difficultyIntervalId);
            } else {
                // Game is resumed: Restart animation and intervals
                pauseButton.innerText = 'Pause';
                renderer.setAnimationLoop(animate); // Restart requestAnimationFrame
                startSpawning(); // Re-establish intervals
            }
        }

        // Game animation loop
        function animate() {
            if (isGameOver || isPaused) return; // Stop animation if game is paused or over

            // Update the animation mixer with the time elapsed since the last frame.
            // Clamp to avoid huge position jumps (and skipped collisions) after a
            // stall — e.g. a backgrounded mobile tab or a GC pause.
            const delta = Math.min(clock.getDelta(), 0.1);
            if (mixer) {
                mixer.update(delta);
            }

            // Scale movement by real elapsed time (normalized to a 60fps baseline
            // so existing gameSpeed tuning values keep their feel). This keeps
            // world movement — and therefore spacing between spawned rows —
            // consistent no matter how fast or unevenly frames arrive, which is
            // what was causing rows to bunch up on slower/janky mobile devices.
            const frameMove = gameSpeed * delta * 60;

            // Smoothly move player towards target lane
            if (player && player.position.x !== targetPlayerX) {
                player.position.x += (targetPlayerX - player.position.x) * playerMoveSpeed;
                // Snap to target if very close to avoid floating point inaccuracies
                if (Math.abs(targetPlayerX - player.position.x) < 0.05) {
                    player.position.x = targetPlayerX;
                }
            }

            // Move road segments
            const totalRoadLength = roadSegmentLength * roadSegmentCount;
            roadSegments.forEach(segment => {
                segment.position.z += frameMove;

                // If segment has moved completely past the camera's view (its front edge is behind the camera)
                // Move it back to the beginning of the road chain
                if (segment.position.z > camera.position.z + 20) { // If it's too far in front of the camera (passed player)
                    segment.position.z -= totalRoadLength; // Move it to the very back of the road chain
                }
            });

            // Distance-based spawning: spawn a new row once the world has
            // scrolled `currentObstacleSpawnDistance` units, so row spacing is
            // consistent regardless of frame rate (currentObstacleSpawnDistance
            // itself still shrinks over time via decreaseSpawnDistances() to
            // ramp up difficulty).
            const spawnZ = camera.position.z - 100; // Z position where new objects are created (far behind camera)
            distanceSinceLastSpawn += frameMove;
            if (distanceSinceLastSpawn >= currentObstacleSpawnDistance) {
                createKarmaSet(spawnZ); // Spawn a complete set of three karma objects
                distanceSinceLastSpawn = 0;
            }


            // Lane+Z proximity collision — reliable for animated SkinnedMesh FBX models.
            // Objects are spawned at exact lanePositions values, so X match just checks the same lane.
            // Player is always at Z=5; detect collision when an object enters a 4-unit window around it.
            const PLAYER_Z = 5;
            const playerLaneX = lanePositions[currentLane];

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.position.z += frameMove;

                let remove = o.position.z > camera.position.z + 20;
                if (!remove) {
                    const xClose = Math.abs(o.position.x - playerLaneX) < laneWidth * 0.55;
                    const zClose = Math.abs(o.position.z - PLAYER_Z) < 3.5;
                    if (xClose && zClose) {
                        karma.bad++;
                        updateScoreboard();
                        remove = true;
                    }
                }
                if (remove) { scene.remove(o); disposeObject3D(o); obstacles.splice(i, 1); }
            }

            for (let i = tokens.length - 1; i >= 0; i--) {
                const t = tokens[i];
                t.position.z += frameMove;

                let remove = t.position.z > camera.position.z + 20;
                if (!remove) {
                    const xClose = Math.abs(t.position.x - playerLaneX) < laneWidth * 0.55;
                    const zClose = Math.abs(t.position.z - PLAYER_Z) < 3.5;
                    if (xClose && zClose) {
                        karma.good++;
                        updateScoreboard();
                        remove = true;
                    }
                }
                if (remove) { scene.remove(t); disposeObject3D(t); tokens.splice(i, 1); }
            }

            // Update scoreboard display
            updateScoreboard();

            // Render the scene with the camera
            renderer.render(scene, camera);

            // Game over condition (example: if bad karma reaches a certain threshold)
            if (karma.bad >= 50) {
                endGame("Game Over! Too much bad karma.");
            }
        }

        // Function to update the scoreboard display
        function updateScoreboard() {
            goodKarmaValue.innerText = karma.good;
            badKarmaValue.innerText = karma.bad;
        }

        // Function to show a message box and stop the game
        function showMessageBox(message) {
            document.getElementById('message-text').innerText = message;
            document.getElementById('message-box').style.display = 'block';
        }

        // Function to hide the message box
        function hideMessageBox() {
            document.getElementById('message-box').style.display = 'none';
        }

        // Function to end the game
        function endGame(message) {
            isGameOver = true;
            renderer.setAnimationLoop(null); // Stop requestAnimationFrame
            // Clear all intervals
            clearInterval(speedIntervalId);
            clearInterval(difficultyIntervalId);
            showMessageBox(message);
        }

        // Function to reset the game state
        // Added a parameter to control if animation loop should be restarted immediately
        function resetGame(restartAnimation = true) {
            // Clear existing obstacles and tokens from scene and arrays
            obstacles.forEach(o => { scene.remove(o); disposeObject3D(o); });
            tokens.forEach(t => { scene.remove(t); disposeObject3D(t); });
            obstacles = [];
            tokens = [];

            karma = { good: 0, bad: 0 }; // Reset karma
            updateScoreboard(); // Update scoreboard display

            currentLane = 1; // Reset player to middle lane
            targetPlayerX = lanePositions[currentLane]; // Always reset lane target
            if (player) {
                player.position.x = lanePositions[currentLane];
            }

            gameSpeed = 0.2; // Reset game speed to initial positive value
            // Reset lastZ to 0 for initial spawning (These are for the old distance-based check, not used for new time-based)
            lastObstacleZ = 0;
            lastTokenZ = 0;
            currentObstacleSpawnDistance = initialObstacleSpawnDistance; // Reset obstacle spawn distance
            currentTokenSpawnDistance = initialTokenSpawnDistance; // Reset token spawn distance

            isGameOver = false; // Reset game over flag
            isPaused = false; // Ensure game is unpaused on reset
            pauseButton.innerText = 'Pause'; // Reset pause button text
            hideMessageBox(); // Hide any message box

            // Reset animation mixer if it exists
            if (mixer) {
                mixer.stopAllAction();
                // If the Mixamo model has animations, restart the first one on reset
                if (player && player.animations && player.animations.length > 0) {
                    const action = mixer.clipAction(player.animations[0]);
                    action.play();
                }
            }
            clock = new THREE.Clock(); // Reset clock for consistent timing
            distanceSinceLastSpawn = currentObstacleSpawnDistance; // Spawn a row immediately on reset


            // Re-setup road segments
            setupRoad();

            // Restart spawning intervals and speed increase
            startSpawning();

            // Restart animation loop if requested
            if (restartAnimation) {
                renderer.setAnimationLoop(animate);
            }
        }

        // Spawning intervals (now only for speed and difficulty increase, not direct object spawning)
        function startSpawning() {
            // Clear any existing intervals to prevent duplicates on reset
            if (speedIntervalId) clearInterval(speedIntervalId);
            if (difficultyIntervalId) clearInterval(difficultyIntervalId);

            // Start speed increase interval
            speedIntervalId = setInterval(increaseGameSpeed, speedIncreaseIntervalTime);

            // Start difficulty increase interval (for spawn distances)
            difficultyIntervalId = setInterval(decreaseSpawnDistances, distanceDecreaseIntervalTime);
        }

        // Key controls for player movement
        window.addEventListener('keydown', (e) => {
            if (isGameOver || isPaused) return;
            if (e.code === 'ArrowLeft') moveLaneLeft();
            else if (e.code === 'ArrowRight') moveLaneRight();
        });

        // Touch controls — swipe left/right to change lanes
        let touchStartX = 0;
        let touchStartY = 0;

        function moveLaneLeft() {
            if (isGameOver || isPaused) return;
            if (currentLane > 0) { currentLane--; targetPlayerX = lanePositions[currentLane]; }
        }
        function moveLaneRight() {
            if (isGameOver || isPaused) return;
            if (currentLane < 2) { currentLane++; targetPlayerX = lanePositions[currentLane]; }
        }

        function isFormElement(el) {
            const tag = el ? el.tagName : '';
            return tag === 'INPUT' || tag === 'SELECT' || tag === 'BUTTON' ||
                   tag === 'TEXTAREA' || tag === 'LABEL' || tag === 'A';
        }
        function isFormVisible() {
            return startFormContainer && startFormContainer.style.display !== 'none';
        }

        window.addEventListener('touchstart', (e) => {
            // Never block touches on interactive elements or while the form is open
            // (doing so prevents the keyboard from appearing on mobile)
            if (isFormElement(e.target) || isFormVisible()) return;
            if (isGameOver || isPaused) return;
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (isFormElement(e.target) || isFormVisible()) return;
            if (isGameOver || isPaused) return;
            e.preventDefault();
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
                if (dx < 0) moveLaneLeft(); else moveLaneRight();
            }
        }, { passive: false });

        // Initialize the game when the window loads
        window.onload = function () {
            init(); // Setup scene, camera, renderer, and initial elements
            // startSpawning() is now called by startGame()
            // The animate loop will be started by startGame()
        };
    </script>
